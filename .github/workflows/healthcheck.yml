name: source-healthcheck
# Weekly: every official source URL the crawler depends on must still resolve. A failure emails the repo owner.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m agent.healthcheck
