name: crawl-official-sources
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (LLM crawl of official sources)
  workflow_dispatch:
permissions:
  contents: write
concurrency: crawl
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Crawl and email new updates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_TO: winstonpark27@gmail.com
        run: python -m agent.run
      - name: Commit refreshed calendar data
        if: always()
        run: |
          git config user.name "calendar-bot"; git config user.email "calendar-bot@users.noreply.github.com"
          git add data/events.json data/events.js && (git diff --cached --quiet || git commit -m "Update calendar data from official sources") && git pull --rebase && git push
